<!DOCTYPE html>
<html lang="mn">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Аура мед — Цаг авах</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=Cormorant+Unicase:wght@300;500&family=Outfit:wght@200;300;400;500&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg-0: #08040f;
      --ink: #f3ecd8;
      --ink-dim: rgba(243,236,216,.70);
      --ink-faint: rgba(243,236,216,.36);
      --gold: #e8c77a;
      --gold-dim: rgba(232,199,122,.12);
      --gold-border: rgba(232,199,122,.22);
    }
    html, body {
      background: var(--bg-0);
      color: var(--ink);
      font-family: 'Outfit', sans-serif;
      font-weight: 300;
      line-height: 1.7;
      overflow-x: hidden;
      min-height: 100vh;
    }
    body {
      background:
        radial-gradient(ellipse at 18% 0%,   rgba(176,132,240,.18), transparent 50%),
        radial-gradient(ellipse at 82% 100%, rgba(230,57,70,.12),   transparent 50%),
        radial-gradient(ellipse at 50% 52%,  rgba(20,10,40,.9),     var(--bg-0) 68%);
    }
    body::before {
      content: ''; position: fixed; inset: 0; pointer-events: none;
      z-index: 999; opacity: .055; mix-blend-mode: overlay;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='3'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
    }

    /* ── NAV ── */
    nav {
      position: fixed; top: 0; left: 0; right: 0; z-index: 200;
      display: flex; justify-content: space-between; align-items: center;
      padding: 1.6rem 3rem;
      background: linear-gradient(to bottom, rgba(8,4,15,.82), transparent);
      backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    }
    .nav-mark { font-family: 'Cormorant Unicase', serif; font-size: .82rem; letter-spacing: .4em; color: var(--gold); text-decoration: none; }
    .nav-links { display: flex; gap: 2.4rem; font-size: .68rem; letter-spacing: .32em; color: var(--ink-faint); text-transform: uppercase; }
    .nav-links a { color: inherit; text-decoration: none; transition: color .3s; }
    .nav-links a:hover, .nav-links a.active { color: var(--gold); }
    @media(max-width:680px) {
      nav { justify-content: center; padding: 1.1rem 1.1rem; }
      .nav-mark { font-size: 1rem; letter-spacing: .42em; }
      .nav-links { display: none; }
    }

    /* ── LAYOUT ── */
    .booking-main { max-width: 1020px; margin: 0 auto; padding: 9rem 2rem 7rem; }

    /* ── HEADER ── */
    .booking-header { text-align: center; margin-bottom: 4.5rem; animation: fadeUp 1.4s .2s both; }
    .eyebrow { font-size: .68rem; letter-spacing: .48em; color: var(--gold); text-transform: uppercase; display: block; margin-bottom: 1rem; }
    .booking-header h1 {
      font-family: 'Cormorant Garamond', serif; font-weight: 300;
      font-size: clamp(2.4rem, 5vw, 4rem); line-height: 1.05;
    }
    .booking-header h1 em { font-style: italic; color: var(--gold); }
    .booking-header .lede { color: var(--ink-dim); font-size: 1rem; margin-top: 1.2rem; }

    /* ── STEP INDICATOR ── */
    .steps {
      display: flex; justify-content: center; align-items: center;
      gap: 1rem; margin-bottom: 3.5rem;
      animation: fadeUp 1.4s .35s both;
    }
    .step {
      display: flex; align-items: center; gap: .5rem;
      font-size: .65rem; letter-spacing: .28em; text-transform: uppercase;
      color: var(--ink-faint); transition: color .4s;
    }
    .step.active { color: var(--gold); }
    .step.done { color: rgba(232,199,122,.55); }
    .step-num {
      width: 22px; height: 22px; border-radius: 50%;
      border: 1px solid currentColor;
      display: flex; align-items: center; justify-content: center;
      font-size: .6rem; flex-shrink: 0;
    }
    .step-sep { color: var(--ink-faint); opacity: .4; font-size: .7rem; }

    /* ── BOOKING GRID ── */
    .booking-grid {
      display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem;
      animation: fadeUp 1.4s .45s both;
    }
    @media(max-width:740px) { .booking-grid { grid-template-columns: 1fr; } }

    /* ── PANEL shared ── */
    .panel {
      background: rgba(243,236,216,.025);
      border: 1px solid var(--gold-border);
      border-radius: 1.1rem;
      padding: 1.8rem;
    }
    .panel-title {
      font-family: 'Cormorant Unicase', serif;
      font-size: .72rem; letter-spacing: .34em;
      color: var(--gold); text-transform: uppercase;
      margin-bottom: 1.4rem;
    }

    /* ── CALENDAR ── */
    .cal-nav {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 1.3rem;
    }
    .cal-nav-btn {
      background: none; border: 1px solid var(--gold-border);
      color: var(--gold); width: 30px; height: 30px; border-radius: 50%;
      cursor: pointer; font-size: 1rem; line-height: 1;
      display: flex; align-items: center; justify-content: center;
      transition: background .25s, border-color .25s;
    }
    .cal-nav-btn:hover { background: var(--gold-dim); border-color: var(--gold); }
    .cal-month {
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.05rem; font-weight: 400; letter-spacing: .06em;
      color: var(--ink-dim);
    }
    .cal-weekdays {
      display: grid; grid-template-columns: repeat(7,1fr);
      margin-bottom: .4rem;
    }
    .cal-weekdays span {
      text-align: center; font-size: .58rem;
      letter-spacing: .18em; text-transform: uppercase;
      color: var(--ink-faint); padding: .3rem 0;
    }
    .cal-days { display: grid; grid-template-columns: repeat(7,1fr); gap: 2px; }
    .cal-day {
      aspect-ratio: 1; display: flex; align-items: center; justify-content: center;
      border: none; background: none; color: var(--ink-dim);
      font-size: .82rem; border-radius: .4rem; cursor: pointer;
      transition: background .2s, color .2s; position: relative;
    }
    .cal-day:hover:not(.disabled):not(.empty):not(.selected) {
      background: var(--gold-dim); color: var(--gold);
    }
    .cal-day.empty { cursor: default; pointer-events: none; }
    .cal-day.disabled { color: var(--ink-faint); opacity: .35; cursor: not-allowed; }
    .cal-day.today::after {
      content: ''; position: absolute; bottom: 3px; left: 50%;
      transform: translateX(-50%); width: 3px; height: 3px;
      border-radius: 50%; background: var(--gold);
    }
    .cal-day.selected {
      background: var(--gold); color: #08040f;
      font-weight: 500;
    }
    .cal-day.selected.today::after { background: #08040f; }

    /* ── SLOTS ── */
    .slots-placeholder {
      display: flex; align-items: center; justify-content: center;
      min-height: 220px; color: var(--ink-faint);
      font-size: .82rem; letter-spacing: .2em; text-align: center;
    }
    .slots-date {
      font-family: 'Cormorant Garamond', serif;
      font-style: italic; font-size: 1.1rem;
      color: var(--ink-dim); margin-bottom: 1.2rem;
    }
    .slots-list { display: flex; flex-direction: column; gap: .6rem; }
    .slot-btn {
      display: flex; justify-content: space-between; align-items: center;
      padding: .85rem 1.1rem;
      border: 1px solid var(--gold-border);
      border-radius: .6rem; background: none;
      cursor: pointer; transition: all .25s; width: 100%;
    }
    .slot-btn:not(.booked):not(.active):hover {
      background: var(--gold-dim); border-color: var(--gold);
    }
    .slot-btn.booked { opacity: .3; cursor: not-allowed; border-color: rgba(243,236,216,.08); }
    .slot-btn.active { background: var(--gold); border-color: var(--gold); }
    .slot-time {
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.45rem; font-weight: 400; color: var(--gold);
    }
    .slot-btn.booked .slot-time { color: var(--ink-faint); }
    .slot-btn.active .slot-time { color: #08040f; }
    .slot-status {
      font-size: .6rem; letter-spacing: .26em; text-transform: uppercase;
      color: var(--ink-faint);
    }
    .slot-btn.active .slot-status { color: rgba(8,4,15,.55); }
    .loading-txt {
      color: var(--ink-faint); font-size: .82rem;
      letter-spacing: .15em; text-align: center; padding: 2.5rem 0;
    }

    /* ── DIVIDER ── */
    .divider {
      display: flex; align-items: center; gap: 1.5rem;
      margin: 3rem 0;
    }
    .divider::before, .divider::after {
      content: ''; flex: 1;
      height: 1px; background: var(--gold-border);
    }
    .divider-mark {
      font-family: 'Cormorant Garamond', serif;
      font-size: 1rem; color: var(--ink-faint); letter-spacing: .6em;
    }

    /* ── FORM ── */
    .form-section { animation: fadeUp .7s both; }
    .form-summary {
      font-family: 'Cormorant Garamond', serif;
      font-style: italic; font-size: 1.55rem; font-weight: 300;
      color: var(--gold); text-align: center; margin-bottom: 2.5rem;
    }
    .form-grid {
      display: grid; grid-template-columns: 1fr 1fr;
      gap: 1.1rem; max-width: 620px; margin: 0 auto;
    }
    @media(max-width:560px) { .form-grid { grid-template-columns: 1fr; } }
    .field { display: flex; flex-direction: column; gap: .45rem; }
    .field.full { grid-column: 1 / -1; }
    label {
      font-size: .62rem; letter-spacing: .3em;
      text-transform: uppercase; color: var(--ink-faint);
    }
    input, textarea {
      background: rgba(243,236,216,.04);
      border: 1px solid var(--gold-border);
      border-radius: .5rem; padding: .8rem 1rem;
      color: var(--ink); font-family: 'Outfit', sans-serif;
      font-size: .95rem; font-weight: 300;
      outline: none; width: 100%;
      transition: border-color .3s, background .3s;
    }
    input:focus, textarea:focus {
      border-color: var(--gold);
      background: rgba(232,199,122,.05);
    }
    input::placeholder, textarea::placeholder { color: var(--ink-faint); }
    textarea { resize: vertical; min-height: 88px; }
    .submit-wrap { grid-column: 1/-1; display: flex; justify-content: center; margin-top: .6rem; }
    .submit-btn {
      padding: .95rem 3.5rem;
      background: var(--gold); border: none; border-radius: 2rem;
      color: #08040f; font-family: 'Cormorant Unicase', serif;
      font-size: .85rem; letter-spacing: .42em;
      cursor: pointer; transition: opacity .3s, transform .3s;
    }
    .submit-btn:hover { opacity: .85; transform: translateY(-2px); }
    .submit-btn:disabled { opacity: .45; cursor: default; transform: none; }

    /* ── SUCCESS ── */
    .success-section {
      text-align: center; padding: 5rem 2rem;
      animation: fadeUp .8s both;
    }
    .success-glyph {
      font-size: 2.8rem; color: var(--gold);
      animation: pulse 3s ease-in-out infinite;
      margin-bottom: 1.5rem;
    }
    .success-section h2 {
      font-family: 'Cormorant Garamond', serif;
      font-weight: 300; font-size: 2.5rem; margin-bottom: 1rem;
    }
    .success-section p { color: var(--ink-dim); margin-bottom: 2.5rem; font-size: 1.05rem; }
    .btn-ghost {
      padding: .75rem 2.5rem; background: none;
      border: 1px solid var(--gold-border); border-radius: 2rem;
      color: var(--gold); font-family: 'Cormorant Unicase', serif;
      font-size: .78rem; letter-spacing: .32em;
      cursor: pointer; transition: background .3s;
    }
    .btn-ghost:hover { background: var(--gold-dim); }

    /* ── KEYFRAMES ── */
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(22px); }
      to   { opacity: 1; transform: none; }
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50%       { transform: scale(1.15); }
    }

    /* ── MOBILE BOTTOM NAV ── */
    .mob-nav {
      display: none;
      position: fixed;
      bottom: 0; left: 0; right: 0;
      z-index: 300;
      background: rgba(8,4,15,.96);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-top: 1px solid rgba(232,199,122,.14);
      padding-bottom: env(safe-area-inset-bottom);
      justify-content: space-around;
      align-items: stretch;
    }
    .mob-nav-item {
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      gap: .28rem; padding: .7rem .5rem .65rem;
      text-decoration: none; color: var(--ink-faint);
      flex: 1; transition: color .2s;
      -webkit-tap-highlight-color: transparent;
    }
    .mob-nav-item.active { color: var(--gold); }
    .mob-nav-item:active { opacity: .6; }
    .mob-nav-icon { font-size: 1.15rem; line-height: 1; }
    .mob-nav-label { font-size: .55rem; letter-spacing: .18em; text-transform: uppercase; }
    .mob-nav-item.active .mob-nav-icon { text-shadow: 0 0 10px rgba(232,199,122,.6); }
    @media(max-width:680px) {
      .mob-nav { display: flex; }
      body { padding-bottom: calc(72px + env(safe-area-inset-bottom)); }
    }
  </style>
</head>
<body>

<nav>
  <a class="nav-mark" href="index.html">✦ Аура мед</a>
  <div class="nav-links">
    <a href="index.html#aura"><span class="num">01 · </span>Аура</a>
    <a href="index.html#chakras"><span class="num">02 · </span>Чакрууд</a>
    <a href="booking.html" class="active"><span class="num">03 · </span>Цаг авах</a>
  </div>
</nav>

<main class="booking-main">

  <!-- Header -->
  <div class="booking-header">
    <span class="eyebrow">03 — Уулзалт</span>
    <h1>Уулзалтын <em>цаг</em><br/>захиалах.</h1>
    <p class="lede">Өдөр болон цагаа сонгоод, мэдээллээ үлдээнэ үү.</p>
  </div>

  <!-- Steps -->
  <div class="steps" id="steps">
    <div class="step active" id="step1">
      <span class="step-num">1</span><span>Өдөр</span>
    </div>
    <span class="step-sep">·</span>
    <div class="step" id="step2">
      <span class="step-num">2</span><span>Цаг</span>
    </div>
    <span class="step-sep">·</span>
    <div class="step" id="step3">
      <span class="step-num">3</span><span>Мэдээлэл</span>
    </div>
  </div>

  <!-- Calendar + Slots -->
  <div class="booking-grid" id="booking-grid">

    <!-- Calendar -->
    <div class="panel">
      <div class="panel-title">Өдөр сонгох</div>
      <div class="cal-nav">
        <button class="cal-nav-btn" id="prev-month" aria-label="Өмнөх сар">‹</button>
        <span class="cal-month" id="month-label"></span>
        <button class="cal-nav-btn" id="next-month" aria-label="Дараах сар">›</button>
      </div>
      <div class="cal-weekdays">
        <span>Да</span><span>Мя</span><span>Лх</span><span>Пү</span><span>Ба</span><span>Бя</span><span>Ня</span>
      </div>
      <div class="cal-days" id="cal-days"></div>
    </div>

    <!-- Time Slots -->
    <div class="panel">
      <div class="panel-title">Цаг сонгох</div>
      <div id="slots-inner">
        <div class="slots-placeholder">← Эхлээд өдөр сонгоно уу</div>
      </div>
    </div>

  </div>

  <!-- Booking Form -->
  <div id="form-section" style="display:none">
    <div class="divider"><span class="divider-mark">· ✦ ·</span></div>
    <div class="form-section">
      <div class="form-summary" id="form-summary"></div>
      <form id="booking-form">
        <div class="form-grid">
          <div class="field">
            <label for="f-name">Нэр *</label>
            <input id="f-name" type="text" required placeholder="Таны нэр">
          </div>
          <div class="field">
            <label for="f-phone">Утасны дугаар *</label>
            <input id="f-phone" type="tel" required placeholder="+976 xxxxxxxx">
          </div>
          <div class="submit-wrap">
            <button type="submit" class="submit-btn" id="submit-btn">Захиалах</button>
          </div>
        </div>
      </form>
    </div>
  </div>

  <!-- Success -->
  <div id="success-section" style="display:none">
    <div class="success-section">
      <div class="success-glyph">✦</div>
      <h2>Захиалга амжилттай!</h2>
      <p id="success-detail"></p>
      <button class="btn-ghost" onclick="location.reload()">Шинэ захиалга оруулах</button>
    </div>
  </div>

</main>

<!-- MOBILE BOTTOM NAV -->
<nav class="mob-nav" aria-label="Mobile navigation">
  <a href="index.html#aura" class="mob-nav-item">
    <span class="mob-nav-icon">○</span>
    <span class="mob-nav-label">Аура</span>
  </a>
  <a href="index.html#chakras" class="mob-nav-item">
    <span class="mob-nav-icon">✦</span>
    <span class="mob-nav-label">Чакра</span>
  </a>
  <a href="booking.html" class="mob-nav-item active">
    <span class="mob-nav-icon">◎</span>
    <span class="mob-nav-label">Цаг авах</span>
  </a>
</nav>

<script type="module">
import { createClient } from 'https://esm.sh/@supabase/supabase-js@2'

const supabase = createClient(
  'https://qvsveyaarinogkquyisb.supabase.co',
  'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InF2c3ZleWFhcmlub2drcXV5aXNiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc1MjYwOTMsImV4cCI6MjA5MzEwMjA5M30.wx0Pc-TbORp2b7Sr_sAP85Y23KtJj1fPYbLpEXZPTTI'
)

const SLOTS    = ['09:00','11:00','13:00','15:00','17:00']
const MN_MONTH = ['Нэгдүгээр','Хоёрдугаар','Гуравдугаар','Дөрөвдүгээр',
                  'Тавдугаар','Зургаадугаар','Долоодугаар','Наймдугаар',
                  'Есдүгээр','Аравдугаар','Арван нэгдүгээр','Арван хоёрдугаар']

let viewDate     = new Date()
let selectedDate = null
let selectedTime = null

function pad(n) { return String(n).padStart(2,'0') }
function toISO(d) { return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}` }
function labelDate(d) { return `${MN_MONTH[d.getMonth()]} сарын ${d.getDate()}` }

/* ── Calendar ── */
function renderCalendar() {
  const y = viewDate.getFullYear(), m = viewDate.getMonth()
  document.getElementById('month-label').textContent = `${MN_MONTH[m]} сар, ${y}`

  const firstDow  = (new Date(y, m, 1).getDay() + 6) % 7  // Mon=0
  const daysInMo  = new Date(y, m + 1, 0).getDate()
  const today     = new Date(); today.setHours(0,0,0,0)

  const container = document.getElementById('cal-days')
  container.innerHTML = ''

  for (let i = 0; i < firstDow; i++) {
    const el = document.createElement('div')
    el.className = 'cal-day empty'
    container.appendChild(el)
  }

  for (let d = 1; d <= daysInMo; d++) {
    const date = new Date(y, m, d)
    const btn  = document.createElement('button')
    btn.className  = 'cal-day'
    btn.textContent = d
    btn.type = 'button'

    const dow     = date.getDay()
    const isPast  = date < today
    const isWeekend = dow === 0 || dow === 6

    if (date.getTime() === today.getTime()) btn.classList.add('today')
    if (selectedDate && toISO(date) === toISO(selectedDate)) btn.classList.add('selected')

    if (isPast || isWeekend) {
      btn.classList.add('disabled')
      btn.disabled = true
    } else {
      btn.addEventListener('click', () => onDateSelect(date))
    }

    container.appendChild(btn)
  }
}

async function onDateSelect(date) {
  selectedDate = date
  selectedTime = null
  renderCalendar()
  document.getElementById('form-section').style.display = 'none'
  setStep(2)

  const inner = document.getElementById('slots-inner')
  inner.innerHTML = '<div class="loading-txt">Ачааллаж байна…</div>'

  const { data } = await supabase
    .from('bookings')
    .select('booking_time')
    .eq('booking_date', toISO(date))

  const booked = (data || []).map(r => r.booking_time)

  inner.innerHTML = `<div class="slots-date">${labelDate(date)}</div><div class="slots-list" id="slots-list"></div>`
  const list = document.getElementById('slots-list')

  SLOTS.forEach(time => {
    const taken = booked.includes(time)
    const btn   = document.createElement('button')
    btn.type      = 'button'
    btn.className = 'slot-btn' + (taken ? ' booked' : '')
    btn.disabled  = taken
    btn.innerHTML = `<span class="slot-time">${time}</span>
                     <span class="slot-status">${taken ? 'Захиалагдсан' : 'Боломжтой'}</span>`
    if (!taken) btn.addEventListener('click', () => onTimeSelect(time, btn))
    list.appendChild(btn)
  })
}

function onTimeSelect(time, btn) {
  selectedTime = time
  document.querySelectorAll('.slot-btn.active').forEach(b => b.classList.remove('active'))
  btn.classList.add('active')
  setStep(3)

  const fs = document.getElementById('form-section')
  document.getElementById('form-summary').textContent = `${labelDate(selectedDate)} · ${time}`
  fs.style.display = 'block'
  fs.scrollIntoView({ behavior: 'smooth', block: 'nearest' })
}

/* ── Month nav ── */
document.getElementById('prev-month').addEventListener('click', () => {
  viewDate.setMonth(viewDate.getMonth() - 1)
  renderCalendar()
})
document.getElementById('next-month').addEventListener('click', () => {
  viewDate.setMonth(viewDate.getMonth() + 1)
  renderCalendar()
})

/* ── Form submit ── */
document.getElementById('booking-form').addEventListener('submit', async e => {
  e.preventDefault()
  const btn = document.getElementById('submit-btn')
  btn.disabled    = true
  btn.textContent = 'Илгээж байна…'

  const { error } = await supabase.from('bookings').insert({
    name:         document.getElementById('f-name').value.trim(),
    phone:        document.getElementById('f-phone').value.trim(),
    booking_date: toISO(selectedDate),
    booking_time: selectedTime
  })

  if (error) {
    btn.disabled    = false
    btn.textContent = 'Захиалах'
    alert('Алдаа гарлаа. Дахин оролдоно уу.\n' + error.message)
    return
  }

  document.getElementById('booking-grid').style.display  = 'none'
  document.getElementById('form-section').style.display  = 'none'
  document.getElementById('steps').style.display         = 'none'
  document.getElementById('success-detail').textContent  =
    `${labelDate(selectedDate)}, ${selectedTime} цагт таны захиалга бүртгэгдлээ.`
  document.getElementById('success-section').style.display = 'block'
})

/* ── Step indicator ── */
function setStep(n) {
  for (let i = 1; i <= 3; i++) {
    const el = document.getElementById('step' + i)
    el.classList.toggle('active', i === n)
    el.classList.toggle('done',   i < n)
  }
}

renderCalendar()
</script>
</body>
</html>
